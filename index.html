<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Marks App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f2f5f9;color:#222}
.container{width:92%;max-width:1200px;margin:30px auto}
h1{text-align:center;color:#1f4e79}
.card{background:white;padding:25px;margin-bottom:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
h2{color:#1f4e79}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{margin-top:20px;padding:12px 25px;border:0;border-radius:7px;background:#1f4e79;color:white;font-size:16px;cursor:pointer}
.clear-btn{background:#d9534f;margin-left:10px}
.delete-btn{background:#dc3545;padding:7px 12px;margin:0;font-size:13px}
.search-box{display:flex;gap:10px}
.search-box input{flex:1}
.search-btn{margin-top:0}
table{width:100%;border-collapse:collapse;margin-top:15px;min-width:950px}
th,td{padding:12px;text-align:center;border:1px solid #ddd}
th{background:#1f4e79;color:white}
tr:nth-child(even){background:#f8f8f8}
.table-wrapper{overflow-x:auto}
.message{margin-top:15px;font-weight:bold}
@media(max-width:700px){
.form-grid{grid-template-columns:1fr}
.search-box{display:block}
.search-btn{margin-top:10px}
}
</style>
</head>

<body>

<div class="container">

<h1>🎓 Student Marks App</h1>

<div class="card">
<h2>➕ Add Student</h2>

<div class="form-grid">

<input id="roll_no" type="number" placeholder="Roll No">
<input id="student_name" type="text" placeholder="Student Name">
<input id="student_class" type="text" placeholder="Class">

<input id="maths" type="number" min="0" max="100" placeholder="Maths Marks">
<input id="science" type="number" min="0" max="100" placeholder="Science Marks">
<input id="english" type="number" min="0" max="100" placeholder="English Marks">

</div>

<button onclick="addStudent()">Add Student</button>
<button class="clear-btn" onclick="clearForm()">Clear</button>

<div id="message" class="message"></div>
</div>

<div class="card">

<h2>🔎 Search Student</h2>

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="Search by Roll No or Student Name"
oninput="searchStudents()"
>

<button class="search-btn" onclick="clearSearch()">Show All</button>

</div>

</div>

<div class="card">

<h2>📋 Student Records</h2>

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Roll No</th>
<th>Name</th>
<th>Class</th>
<th>Maths</th>
<th>Science</th>
<th>English</th>
<th>Total</th>
<th>Percentage</th>
<th>Grade</th>
<th>Action</th>
</tr>
</thead>

<tbody id="studentTableBody"></tbody>

</table>

</div>
</div>

</div>

<script>

const SUPABASE_URL =
"https://ljazrsxfxpnwsdkeoogu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_37aoy8B3OrKnnGWiy0F7qQ_K6ho60kq";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allStudents = [];

document.addEventListener("DOMContentLoaded", function(){
loadStudents();
});


async function addStudent(){

const rollNo =
document.getElementById("roll_no").value;

const name =
document.getElementById("student_name").value.trim();

const studentClass =
document.getElementById("student_class").value.trim();

const mathsValue =
document.getElementById("maths").value;

const scienceValue =
document.getElementById("science").value;

const englishValue =
document.getElementById("english").value;

const message =
document.getElementById("message");


if(
rollNo === "" ||
name === "" ||
studentClass === "" ||
mathsValue === "" ||
scienceValue === "" ||
englishValue === ""
){

message.style.color="red";
message.innerText="⚠️ Please fill all fields.";
return;

}

const maths=Number(mathsValue);
const science=Number(scienceValue);
const english=Number(englishValue);

if(
maths<0 || maths>100 ||
science<0 || science>100 ||
english<0 || english>100
){

message.style.color="red";
message.innerText="⚠️ Marks must be between 0 and 100.";
return;

}

const total=maths+science+english;

const percentage =
Number(((total/300)*100).toFixed(2));

let grade;

if(percentage>=90) grade="A+";
else if(percentage>=80) grade="A";
else if(percentage>=70) grade="B+";
else if(percentage>=60) grade="B";
else if(percentage>=50) grade="C";
else if(percentage>=35) grade="D";
else grade="F";


const {data,error}=await supabaseClient
.from("students")
.insert({
roll_no:Number(rollNo),
student_name:name,
"class":studentClass,
maths:maths,
science:science,
english:english,
total:total,
percentage:percentage,
grade:grade
})
.select();


if(error){

console.error(error);

message.style.color="red";
message.innerText="❌ "+error.message;

return;

}

message.style.color="green";
message.innerText="✅ Student saved to Supabase!";

clearForm();

await loadStudents();

}


async function loadStudents(){

const tableBody =
document.getElementById("studentTableBody");

tableBody.innerHTML=`
<tr>
<td colspan="10">Loading...</td>
</tr>
`;

const {data,error}=await supabaseClient
.from("students")
.select("*")
.order("id",{ascending:true});

if(error){

console.error(error);

tableBody.innerHTML=`
<tr>
<td colspan="10">❌ ${error.message}</td>
</tr>
`;

return;

}

allStudents=data || [];

displayStudents(allStudents);

}


function displayStudents(students){

const tableBody =
document.getElementById("studentTableBody");

tableBody.innerHTML="";

if(students.length===0){

tableBody.innerHTML=`
<tr>
<td colspan="10">No student records found.</td>
</tr>
`;

return;

}

students.forEach(student=>{

const row=document.createElement("tr");

row.innerHTML=`

<td>${student.roll_no}</td>
<td>${student.student_name}</td>
<td>${student.class}</td>
<td>${student.maths}</td>
<td>${student.science}</td>
<td>${student.english}</td>
<td>${student.total}</td>
<td>${student.percentage}%</td>
<td>${student.grade}</td>

<td>
<button
class="delete-btn"
onclick="deleteStudent(${student.id})">
Delete
</button>
</td>

`;

tableBody.appendChild(row);

});

}


function searchStudents(){

const search =
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();

if(search===""){

displayStudents(allStudents);
return;

}

const filtered =
allStudents.filter(student=>{

const roll =
String(student.roll_no).toLowerCase();

const name =
String(student.student_name).toLowerCase();

return roll.includes(search) ||
name.includes(search);

});

displayStudents(filtered);

}


function clearSearch(){

document.getElementById("searchInput").value="";

displayStudents(allStudents);

}


async function deleteStudent(id){

if(!confirm("Are you sure you want to delete this student?")){
return;
}

const {error}=await supabaseClient
.from("students")
.delete()
.eq("id",id);

if(error){

alert("❌ Delete failed: "+error.message);
return;

}

loadStudents();

}


function clearForm(){

document.getElementById("roll_no").value="";
document.getElementById("student_name").value="";
document.getElementById("student_class").value="";
document.getElementById("maths").value="";
document.getElementById("science").value="";
document.getElementById("english").value="";

}

</script>

</body>
</html>
