<!DOCTYPE html>
<html>
<head>
    <title>Student Marks App</title>
</head>
<body>

    <h1>🎓 Student Marks App</h1>

    <h2>Add Student</h2>

    <input id="roll_no" placeholder="Roll No">
    <input id="student_name" placeholder="Student Name">
    <input id="class" placeholder="Class">
    <input id="test" placeholder="Test">

    <br><br>

    <input id="eng" type="number" placeholder="English">
    <input id="math" type="number" placeholder="Math">
    <input id="sci" type="number" placeholder="Science">
    <input id="social" type="number" placeholder="Social">
    <input id="computer" type="number" placeholder="Computer">

    <br><br>

    <button onclick="addStudent()">Add Student</button>

    <h2>Students</h2>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Class</th>
                <th>Test</th>
                <th>English</th>
                <th>Math</th>
                <th>Science</th>
                <th>Social</th>
                <th>Computer</th>
            </tr>
        </thead>

        <tbody id="studentTable"></tbody>
    </table>

    <script>
        function addStudent() {
            alert("Student added!");
        }
    </script>

</body>
</html>
